<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>代云海 & 冯馨瑶 婚礼邀请函</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif SC', serif;
            background: #f0ebe4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);
        }

        /* Header */
        .card-header {
            position: relative;
            padding: 40px 30px 35px;
            background: linear-gradient(145deg, #faf7f2 0%, #f0ebe3 50%, #e8e0d4 100%);
            text-align: center;
        }

        .header-content {
            text-align: center;
        }

        .header-ornament {
            width: 50px;
            height: 1px;
            background: #c9a96e;
            margin: 0 auto 16px;
        }

        .header-label {
            font-size: 10px;
            letter-spacing: 5px;
            color: #c9a96e;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .header-names {
            font-size: 28px;
            font-weight: 300;
            color: #333;
            letter-spacing: 4px;
        }

        .header-amp {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 22px;
            color: #c9a96e;
            margin: 8px 0;
        }

        /* Body */
        .card-body {
            padding: 28px 25px 25px;
            text-align: center;
        }

        .invite-text {
            font-size: 14px;
            line-height: 2.2;
            color: #777;
            font-weight: 300;
            margin-bottom: 22px;
        }

        .invite-text strong {
            color: #444;
            font-weight: 400;
        }

        .divider {
            width: 30px;
            height: 1px;
            background: #c9a96e;
            margin: 0 auto 22px;
        }

        /* Info cards */
        .info-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 24px;
        }

        .info-item {
            text-align: center;
        }

        .info-icon {
            font-size: 18px;
            margin-bottom: 6px;
            color: #c9a96e;
        }

        .info-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #bbb;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            color: #444;
            font-weight: 400;
        }

        .info-sub {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
        }

        /* CTA Button */
        .cta-btn {
            display: inline-block;
            padding: 14px 40px;
            background: #c9a96e;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 3px;
            border-radius: 30px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(201,169,110,0.3);
        }

        .cta-btn:hover {
            background: #b8954f;
            box-shadow: 0 6px 20px rgba(201,169,110,0.4);
            transform: translateY(-1px);
        }

        /* Footer */
        .card-footer {
            padding: 16px 25px 22px;
            text-align: center;
            border-top: 1px solid #f0ebe4;
        }

        .footer-msg {
            font-size: 15px;
            color: #999;
            letter-spacing: 3px;
            font-weight: 300;
        }

        .footer-names {
            font-size: 12px;
            color: #c9a96e;
            letter-spacing: 2px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="header-content">
                <div class="header-ornament"></div>
                <div class="header-label">Wedding Invitation</div>
                <div class="header-names">代云海</div>
                <div class="header-amp">&</div>
                <div class="header-names">冯馨瑶</div>
            </div>
        </div>

        <div class="card-body">
            <div class="invite-text">
                谨定于<br>
                <strong>公历二〇二六年十一月十一日</strong><br>
                农历丙午年十月初三<br>
                举行结婚典礼<br>
                恭请光临
            </div>

            <div class="divider"></div>

            <div class="info-row">
                <div class="info-item">
                    <div class="info-icon">&#128197;</div>
                    <div class="info-label">日期</div>
                    <div class="info-value">11月11日</div>
                    <div class="info-sub">星期三</div>
                </div>
                <div class="info-item">
                    <div class="info-icon">&#128205;</div>
                    <div class="info-label">地点</div>
                    <div class="info-value">大众酒家</div>
                    <div class="info-sub">犍为县罗城镇</div>
                </div>
            </div>

            <a class="cta-btn" href="https://yunhaidai.github.io/wedding-invitation/" target="_blank">
                查看完整邀请函
            </a>
        </div>

        <div class="card-footer">
            <div class="footer-msg">执子之手 与子偕老</div>
            <div class="footer-names">代云海 & 冯馨瑶 敬邀</div>
        </div>
    </div>
</body>
</html>
